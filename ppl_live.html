<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: Arial, Helvetica, sans-serif; background:#f6f6f6; color:#1a1a1a; }
  .top { background:#fff; border-bottom:1px solid #e5e5e5; }
  .top .in { max-width:820px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; justify-content:space-between; }
  .top img { height:38px; display:block; }
  .top span { font-size:13px; color:#666; }
  main { max-width:820px; margin:0 auto; padding:16px; }
  .banner { width:100%; display:block; border-radius:8px; }

  .card { background:#fff; border:1px solid #e3e3e3; border-radius:8px; margin-top:16px; padding:22px 20px; }
  .head { display:flex; align-items:center; gap:16px; }
  .pic { width:72px; height:72px; border-radius:50%; border:2px solid #ED5500; display:flex; align-items:center; justify-content:center; flex:none; background:#fff; }
  .pic img { height:40px; }
  .tag { display:inline-block; font-size:12px; font-weight:bold; padding:3px 9px; border-radius:4px; margin-bottom:6px; color:#fff; }
  .LIVE { background:#d91e1e; }
  .SOLD { background:#1f8a3b; }
  .UNSOLD { background:#6b6b6b; }
  .UPNEXT { background:#ED5500; }
  .WAITING { background:#9a9a9a; }
  .name { font-size:24px; font-weight:bold; margin:0; }
  .meta { font-size:14px; color:#555; margin-top:3px; }

  .boxes { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:20px; }
  .box { border:1px solid #e3e3e3; border-radius:6px; padding:12px 14px; }
  .box .k { font-size:12px; color:#777; text-transform:uppercase; letter-spacing:.5px; }
  .box .v { font-size:26px; font-weight:bold; margin-top:4px; }
  .box .v.amt { color:#ED5500; }
  .box .s { font-size:13px; color:#666; margin-top:2px; }
  .note { font-size:13px; color:#777; margin-top:12px; }
  .box { transition:background .8s; }
  .bump { background:#ffe2cc; }

  .yt { background:#fff; border:1px solid #e3e3e3; border-radius:8px; margin-top:16px; padding:16px 20px 18px; }
  .yt h2 { font-size:16px; margin:0 0 10px; }
  .ytframe { position:relative; width:100%; padding-top:56.25%; background:#000; border-radius:6px; overflow:hidden; }
  .ytframe iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .ytbtn { display:inline-block; margin-top:10px; background:#ED5500; color:#fff; text-decoration:none; font-size:14px; font-weight:bold; padding:8px 14px; border-radius:5px; }
  footer { max-width:820px; margin:0 auto; padding:4px 16px 24px; font-size:12px; color:#888; }
  footer b { color:#1f8a3b; }
  footer.off b { color:#d91e1e; }
  @media (max-width:520px) { .boxes { grid-template-columns:1fr; } .name { font-size:21px; } .box .v { font-size:24px; } }
</style>

<script>
const LIVE_URL = 'https://script.google.com/macros/s/AKfycbyUO2pfXfY5aMkEQkxvJKol6Wc-2B3a6p5oyqYZ6Au0Ce1WohY0f2iQE5k-DYsawmJS/exec?live';
const POLL_MS = 3000;          // how often to check for a new bid
const MAX_WAIT_MS = 20000;     // longest wait when Google is busy

// YouTube live stream — to change it, paste the new link between the quotes
const YOUTUBE_LINK = 'https://www.youtube.com/watch?v=LpkS9WqfxCA';

const $ = id => document.getElementById(id);
const fmt = n => '₹' + Number(n).toLocaleString('en-IN');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const TAG = { 'LIVE': 'Live now', 'SOLD': 'Sold', 'UNSOLD': 'Unsold', 'UP NEXT': 'Up next', 'WAITING': 'Auction starts soon' };

let lastKey = '', lastTs = 0, lastPrice = null, lastOk = 0;

function box(k, v, s, amt) {
  return `<div class="box"><div class="k">${k}</div><div class="v ${amt ? 'amt' : ''}">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;
}

function show(d) {
  const key = JSON.stringify(d);
  if (key === lastKey) return;
  lastKey = key;
  const st = d.player ? (d.status || 'WAITING') : 'WAITING';

  $('tag').className = 'tag ' + st.replace(' ', '');
  $('tag').textContent = TAG[st] || st;

  if (st === 'WAITING') {
    $('name').textContent = 'PP Premier League 5.0';
    $('meta').textContent = 'Players will appear here as they come up for bidding.';
    $('body').innerHTML = '';
    lastPrice = null;
    return;
  }

  $('name').textContent = d.player;
  $('meta').textContent = `${d.memberId} · ${d.category} · ${d.country}`;

  if (st === 'LIVE') {
    $('body').innerHTML = `<div class="boxes">${box('Current bid', fmt(d.price), 'Base price ' + fmt(d.base), true)}${box('Held by', esc(d.teamName), esc(d.team))}</div>`;
    if (lastPrice !== null && lastPrice !== d.price) {
      const b = document.querySelector('.box'); b.classList.add('bump'); setTimeout(() => b.classList.remove('bump'), 400);
    }
    lastPrice = d.price;
  } else if (st === 'SOLD') {
    $('body').innerHTML = `<div class="boxes">${box('Sold to', esc(d.teamName), esc(d.team))}${box('Price', fmt(d.price), 'Base price ' + fmt(d.base), true)}</div>`;
    lastPrice = null;
  } else if (st === 'UNSOLD') {
    $('body').innerHTML = `<p class="note">Not sold in this round. Base price ${fmt(d.base)}.</p>`;
    lastPrice = null;
  } else {
    $('body').innerHTML = `<div class="boxes">${box('Base price', fmt(d.base), 'Bidding starts shortly', true)}</div>`;
    lastPrice = null;
  }
}

// YouTube box
(function () {
  const m = YOUTUBE_LINK.match(/(?:v=|youtu\.be\/|\/live\/|\/embed\/)([A-Za-z0-9_-]{11})/);
  if (!m) { $('ytBox').style.display = 'none'; return; }
  $('ytFrame').src = 'https://www.youtube.com/embed/' + m[1] + '?rel=0';
  $('ytLink').href = YOUTUBE_LINK;
})();

// Checking for updates: pauses while the page isn't on screen, slows down if Google is busy
let timer = null, fails = 0, busy = false;
function schedule(ms) { clearTimeout(timer); timer = setTimeout(poll, ms); }
async function poll() {
  if (document.hidden) return;                 // resumes when the page is visible again
  if (busy) return;
  busy = true;
  try {
    const res = await fetch(LIVE_URL + '&t=' + Date.now(), { cache: 'no-store' });
    const d = await res.json();
    if (!d.ts || d.ts >= lastTs) { lastTs = d.ts || lastTs; show(d); }
    lastOk = Date.now(); fails = 0;
  } catch (e) { fails++; }
  busy = false;
  const off = Date.now() - lastOk > 10000;
  $('foot').className = off ? 'off' : '';
  $('footText').textContent = off ? 'Reconnecting…' : 'This page updates on its own — no need to refresh.';
  const wait = fails ? Math.min(POLL_MS * Math.pow(2, fails), MAX_WAIT_MS) : POLL_MS;
  schedule(wait + Math.floor(Math.random() * 500));
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) schedule(0); });
poll();
</script>
